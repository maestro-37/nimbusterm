<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 13px; line-height: 1.45; color: #1d1d1f; margin: 0; padding: 0 4px; background: transparent; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; }
    p { margin: 0 0 10px 0; }
    .note { font-size: 11px; color: #6e6e73; margin-top: 14px; }
    @media (prefers-color-scheme: dark) { body { color: #e8e8ed; } .note { color: #98989d; } }
</style>
</head>
<body>
    <h1>Done</h1>
    <p>NimbusTerm is installed in <b>Applications</b>.</p>
    <p>Open it from Launchpad or Finder. On first launch you can create an SSH/SFTP session or import <code>~/.ssh/config</code> and MobaXterm sessions.</p>
    <p class="note">A local shell opens automatically. Passwords stay in Keychain and never appear in configuration files.</p>
</body>
